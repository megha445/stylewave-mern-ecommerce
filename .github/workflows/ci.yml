name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check backend JavaScript
        run: |
          find . -path ./node_modules -prune -o -name "*.js" -print -exec node --check {} \;

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BACKEND_URL: http://localhost:4000
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_replace_me
        run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BACKEND_URL: http://localhost:4000
        run: npm run build

  seller:
    name: Seller build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seller
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: seller/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BACKEND_URL: http://localhost:4000
        run: npm run build

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [backend, frontend, admin, seller]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t stylewave-backend ./backend

      - name: Build frontend image
        run: docker build --build-arg VITE_BACKEND_URL=http://localhost:4000 --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_replace_me -t stylewave-frontend ./frontend

      - name: Build admin image
        run: docker build --build-arg VITE_BACKEND_URL=http://localhost:4000 -t stylewave-admin ./admin

      - name: Build seller image
        run: docker build --build-arg VITE_BACKEND_URL=http://localhost:4000 -t stylewave-seller ./seller
