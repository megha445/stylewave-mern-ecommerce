services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      TRUST_PROXY: "false"
      MONGO_URI: mongodb://mongo:27017/stylewave
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_real_use
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM_NAME: Stylewave
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      FRONTEND_URL: http://localhost:5173
      ADMIN_DASHBOARD_URL: http://localhost:5174
      SELLER_DASHBOARD_URL: http://localhost:5175
      SOCKET_CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:4000
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_replace_me}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      args:
        VITE_BACKEND_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

  seller:
    build:
      context: ./seller
      args:
        VITE_BACKEND_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - backend

volumes:
  mongo_data:
